<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Artemis Lawn and Leaf</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand-group">
      <a href="index.html" class="brand" data-brand>Artemis Lawn and Leaf</a>
      <span class="status-pill"><span class="dot"></span>SYSTEM ONLINE</span>
    </div>
    <nav class="site-nav">
      <a href="/">Home</a>
      <a href="pricing">Pricing</a>
      <a href="calendar">Calendar</a>
    </nav>
  </div>
</header>

<section class="calendar-section">
  <div class="wrap">
    <div class="section-head">
      <h2>Seasonal care calendar</h2>
    </div>
    <div class="month-row" id="month-cards"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="contact-block">
      <div><strong data-brand>Artemis Lawn and Leaf</strong></div>
      <div>Phone: <a href="tel:" data-phone></a></div>
      <div>Email: <a href="mailto:" data-email></a></div>
      <div data-address></div>
      <div data-hours></div>
    </div>
  </div>
</footer>

<script src="site.js"></script>
<script>
  initSite().then(({ config, season }) => {
    const row = document.getElementById('month-cards');
    row.innerHTML = config.calendar[season].map(m => `
      <div class="month-card hud-panel">
        <h3>${m.month}</h3>
        <ul>${m.tasks.map(t => `<li>${t}</li>`).join('')}</ul>
      </div>
    `).join('');
  });
</script>

</body>
</html>
