<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artemis Lawn and Leaf</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand-group">
      <a href="index.html" class="brand" data-brand>Artemis Lawn and Leaf</a>
      <span class="status-pill"><span class="dot"></span>SYSTEM ONLINE</span>
    </div>
    <nav class="site-nav">
      <a href="/">Home</a>
      <a href="pricing">Pricing</a>
      <a href="calendar">Calendar</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="hero-text">
      <p class="tagline" id="tagline"></p>
      <h1 id="business-name">Artemis Lawn and Leaf</h1>
      <p class="description" id="description"></p>
      <div class="cta-row">
        <a class="btn primary" href="tel:" id="call-btn">Call now</a>
        <a class="btn secondary" href="pricing.html">See pricing</a>
      </div>
    </div>
    <div class="hero-art" id="hero-art"></div>
  </div>
</section>

<section class="services">
  <div class="wrap">
    <div class="section-head">
      <h2>Active services</h2>
    </div>
    <div class="card-row" id="service-cards"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="contact-block">
      <div><strong data-brand>Treasure Valley Lawn Care</strong></div>
      <div>Phone: <a href="tel:" data-phone></a></div>
      <div>Email: <a href="mailto:" data-email></a></div>
      <div data-address></div>
      <div data-hours></div>
    </div>
  </div>
</footer>

<script src="site.js"></script>
<script>
  initSite().then(({ config, season }) => {
    document.getElementById('tagline').textContent = config.business.tagline[season];
    document.getElementById('business-name').textContent = config.business.name;
    document.getElementById('description').textContent = config.business.description[season];
    document.getElementById('hero-art').innerHTML = heroArt(season);

    const callBtn = document.getElementById('call-btn');
    callBtn.href = `tel:${config.business.phone.replace(/[^\d+]/g, '')}`;

    const row = document.getElementById('service-cards');
    row.innerHTML = config.services[season].map(s => `
      <div class="service-card hud-panel">
        <h3>${s.title}</h3>
        <span class="price mono">${s.price}</span>
        <p>${s.blurb}</p>
      </div>
    `).join('');
  });
</script>

</body>
</html>
