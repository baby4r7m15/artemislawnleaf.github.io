<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing — Artemis Lawn and Leaf</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand" data-brand>Artemis Lawn and Leaf</a>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="pricing.html">Pricing</a>
      <a href="calendar.html">Calendar</a>
    </nav>
  </div>
</header>

<section class="pricing-section">
  <div class="wrap">
    <div class="section-head">
      <h2>Pricing</h2>
      <span class="note" data-season-tag></span>
    </div>
    <div class="plan-row" id="plan-cards"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="contact-block">
      <div><strong data-brand>Artemis Lawn and Leaf</strong></div>
      <div>Phone: <a href="tel:" data-phone></a></div>
      <div>Email: <a href="mailto:" data-email></a></div>
      <div data-address></div>
      <div data-hours></div>
    </div>
    <span class="season-tag" data-season-tag></span>
  </div>
</footer>

<script src="site.js"></script>
<script>
  initSite().then(({ config, season }) => {
    const row = document.getElementById('plan-cards');
    row.innerHTML = config.pricing[season].map(p => `
      <div class="plan-card ${p.featured ? 'featured' : ''}">
        ${p.featured ? '<span class="badge">Most popular</span>' : ''}
        <span class="plan-name">${p.plan}</span>
        <span class="plan-price">${p.price}</span>
        <span class="plan-period">${p.period}</span>
        <p class="plan-details">${p.details}</p>
      </div>
    `).join('');
  });
</script>

</body>
</html>
